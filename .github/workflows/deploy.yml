name: Update data and deploy

on:
  push:
    branches: [master]
  schedule:
    - cron: '3-59/10 * * * *'
  workflow_dispatch:
    inputs:
      rescan:
        description: Fetch every block again instead of resuming from the live site
        type: boolean
        default: false

# Each job gets only what it needs: the build can read, and only the deploy job can publish.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
      pages: read # to look up the site URL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm ci --ignore-scripts
      - run: npm run check
      # The data from the last run is kept in the Actions cache, so a run only asks the mempool API
      # for blocks mined since then. The live site is the fallback when the cache is empty.
      - name: Restore block data from the last run
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/data
          key: block-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: block-data-
      - name: Update block data
        run: npm run data:update
        env:
          SV2_PREVIOUS_DATA_URL: ${{ steps.pages.outputs.base_url }}
          SV2_RESCAN: ${{ inputs.rescan }}
      - name: Keep block data for the next run
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/data
          key: block-data-${{ github.run_id }}-${{ github.run_attempt }}
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
